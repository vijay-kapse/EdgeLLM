[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantcost"
version = "0.2.0"
description = "Measure what quantization actually costs on your own hardware: speed, size, memory and quality."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vijay Kapse" }]
keywords = [
  "llm", "quantization", "onnx", "onnxruntime", "benchmark", "edge",
  "inference", "int8", "int4", "perplexity", "qualcomm", "npu",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Benchmark",
]
dependencies = [
  "onnxruntime>=1.18",
  "numpy>=1.24",
  "tokenizers>=0.19",
  "huggingface_hub>=0.23",
  "typer>=0.12",
  "psutil>=5.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Authoring new quantized artifacts (export + quantize). Not needed to run a
# benchmark or submit results.
quantize = [
  "torch>=2.2",
  "transformers>=4.44",
  "onnx>=1.16",
  "optimum[onnxruntime]>=1.20",
  "onnx_ir>=0.2",           # required by ORT's INT4 MatMulNBitsQuantizer
  "datasets>=2.19",
]
report = [
  "matplotlib>=3.8",
]
aihub = [
  "qai-hub>=0.9",           # Qualcomm AI Hub client (compile + profile on real devices)
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/vijay-kapse/EdgeLLM"
Leaderboard = "https://github.com/vijay-kapse/EdgeLLM/blob/main/results/LEADERBOARD.md"
Issues = "https://github.com/vijay-kapse/EdgeLLM/issues"

[project.scripts]
quantcost = "edgellm.cli:main"
# The authoring path (export/quantize/C++/NPU) is still EdgeLLM, and keeps its
# own command name. Both entry points are the same CLI.
edgellm = "edgellm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["edgellm"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's API deliberately puts Option()/Argument() calls in argument defaults.
"edgellm/cli.py" = ["B008"]
"edgellm/cli_bench.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
